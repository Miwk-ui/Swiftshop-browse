<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>SwiftShop</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="chrome">
      <div id="tabstrip">
        <div id="tabs"></div>
        <button id="btn-newtab" title="New tab (Ctrl+T)">+</button>
        <div id="stats" title="Last page load"></div>
      </div>
      <div id="toolbar">
        <button id="btn-back" title="Back (Alt+Left)">&#8592;</button>
        <button id="btn-fwd" title="Forward (Alt+Right)">&#8594;</button>
        <button id="btn-reload" title="Reload (Ctrl+R)">&#10227;</button>
        <input id="address" spellcheck="false" placeholder="Search or enter address" />
        <button id="btn-star" title="Bookmark this page">&#9734;</button>
        <span id="chips"></span>
        <button id="btn-downloads" title="Downloads">&#8681;</button>
        <button id="btn-bookmarks" title="Bookmarks">&#9776;</button>
        <button id="btn-settings" title="Settings">&#9881;</button>
      </div>
      <div id="panel" hidden></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
